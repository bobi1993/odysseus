# Add to odysseus/docker-compose.yml under the `services:` section.
# This extends the existing compose file with the face recognition microservice.

# ─── FACE RECOGNITION SERVICE ────────────────────────────────────────────
  face-service:
    build:
      context: ../face-service
      dockerfile: Dockerfile
    ports:
      - "${FACE_SERVICE_BIND:-127.0.0.1}:8050:8050"
    volumes:
      # Share data directory with Odysseus (video files, database)
      - ${APP_DATA_DIR:-./data}:/app/data:z
      # Model cache: persists downloaded ArcFace models
      - face-model-cache:/app/models
      # Temp storage for keyframe extraction
      - face-temp:/tmp/vrframes
    environment:
      - LOG_LEVEL=${FACE_LOG_LEVEL:-INFO}
      - FACE_MODEL_NAME=${FACE_MODEL_NAME:-w600k_r50}
      - FACE_MODEL_DIR=/app/models
      - FACE_DETECTION_SIZE=${FACE_DETECTION_SIZE:-640}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.35}
      - FACE_CLUSTER_THRESHOLD=${FACE_CLUSTER_THRESHOLD:-0.50}
      - FACE_MIN_CONFIDENCE=${FACE_MIN_CONFIDENCE:-0.60}
      - KEYFRAME_INTERVAL_SEC=${KEYFRAME_INTERVAL_SEC:-5}
      - KEYFRAME_MAX_PER_VIDEO=${KEYFRAME_MAX_PER_VIDEO:-20}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:latest}
      - API_KEY=${FACE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Memory cap: 5GB (leaves ~11GB for Odysseus + Ollama + other services)
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Model download on first run can take 30-60s

# Add to the `volumes:` section at the bottom of docker-compose.yml:
#   face-model-cache:
#   face-temp:
